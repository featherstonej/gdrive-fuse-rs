[package]
name = "gdrive-fuse-rs"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <you@example.com>"]
description = "A lightweight, read-only Google Drive FUSE filesystem written in Rust for Linux and GNOME."
license = "GPL-3.0-only"

[dependencies]
# Async Runtime & Utilities
tokio = { version = "1.38", features = ["full"] }
futures = "0.3"
bytes = "1.6"

# Filesystem (FUSE)
fuser = { version = "0.14", default-features = false }
libc = "0.2"

# HTTP & API Client
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"

# Authentication, Browser Launch & Keyring
oauth2 = "4.4"
keyring = "2.1"
open = "5.1"

# Caching & Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Time, Config, Paths & Error Handling
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
toml = "0.8"
thiserror = "1.0"
anyhow = "1.0"

# Logging & CLI
env_logger = "0.11"
log = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
